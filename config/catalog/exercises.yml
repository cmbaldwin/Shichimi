    source_url: "https://www.acefitness.org/resources/everyone/exercise-library/13/bent-knee-push-up/"
    source_name: "ACE Fitness"
- slug: tricep_dip
  name: Triceps Dips
  category: upper
  impact: low
  level: 2
  equipment: chair
  floor: false
  sides: false
  ja: 椅子ディップス（トライセプスディップ）
  muscles:
  - triceps
  - shoulders
  - chest
  cues:
  - Hands on a sturdy chair edge
  - Keep hips close to the chair
  - Elbows point back, not out
  - Lower only until shoulders feel fine
  easier: Bend knees and keep a shallower dip.
  harder: Straighten legs and lift one foot.
  met: 4.0
  reference:
    video_url: "https://www.youtube.com/watch?v=0326dy_-CzM"
    video_title: "How to Do Triceps Bench Dips"
    video_channel: "LIVESTRONG"
    source_url: "https://www.acefitness.org/certifiednewsarticle/3008/ace-study-identifies-best-triceps-exercises/"
    source_name: "ACE Fitness"
- slug: push_up_rotation
  name: Push-up & Rotation
  category: upper
  impact: low
  level: 3
  equipment:
  floor: true
  sides: false
  ja: プッシュアップローテーション
  muscles:
  - chest
  - triceps
  - shoulders
  - obliques
  - core
  cues:
  - Lower with control, then press up
  - Rotate your whole torso, arm to ceiling
  - Feet planted, hips steady
  - Look at your top hand
  easier: Plain Push-ups, or Knee Push-ups with the rotation.
  harder: Hold a dumbbell or filled bottle in the top hand.
  met: 5.0
  reference:
    video_url: "https://www.youtube.com/watch?v=Plv5CIclPtQ"
    video_title: "How to Do：PUSH-UP & ROTATION"
    video_channel: "Leap Fitness"
    source_url: "https://www.nasm.org/resource-center/blog/training/proper-push-up-form-and-technique-a-complete-guide"
    source_name: "NASM (push-up base form)"
- slug: pike_push_up
  name: Pike Push-ups
  category: upper
  impact: low
  level: 3
  equipment:
  floor: true
  sides: false
  ja: パイクプッシュアップ
  muscles:
  - shoulders
  - triceps
  - upper-chest
  - core
  cues:
  - Hips high, body an upside-down V
  - Lower the top of your head forward
  - Elbows track back, not wide
  - Press the floor away
  easier: Shallower dip with hands wider, or Plank Shoulder Taps.
  harder: Elevate your feet on a chair.
  met: 5.0
  reference:
    video_url: "https://www.youtube.com/watch?v=x7_I5SUAd00"
    video_title: "Pike Pushup"
    video_channel: "LivestrongWoman"
    source_url: "https://www.nasm.org/resource-center/exercise-library/pike-push-up"
    source_name: "NASM"
- slug: shoulder_taps
  name: Plank Shoulder Taps
  category: upper
  impact: low
  level: 2
  equipment:
  floor: true
  sides: false
  ja: ショルダータップ
  muscles:
  - shoulders
  - core
  - chest
  - obliques
  cues:
  - Feet wide for a steady base
  - Tap each shoulder, hips level
  - Squeeze your glutes and belly
  - Breathe, don't hold your breath
  easier: Do it on your knees, or hands on a chair seat.
  harder: Feet closer together, or add a push-up between taps.
  met: 4.5
  reference:
    video_url: "https://www.youtube.com/watch?v=QOCn3_iOAro"
    video_title: "Plank w/shoulder taps"
    video_channel: "Northeastern"
    source_url: "https://www.onepeloton.com/blog/shoulder-taps"
    source_name: "Peloton (no ACE page)"
- slug: inchworm
  name: Inchworms
  category: upper
  impact: low
  level: 2
  equipment:
  floor: true
  sides: false
  ja: インチワーム
  muscles:
  - hamstrings
  - shoulders
  - core
  - chest
  cues:
  - Soft knees, fold forward from the hips
  - Walk hands out to a plank
  - Keep your core tight, no sagging
  - Walk feet to hands, stand tall
  easier: Walk hands out a short way, bending knees freely.
  harder: Add a push-up at the plank each rep.
  met: 4.0
  reference:
    video_url: "https://www.youtube.com/watch?v=Z19gpqxQBwo"
    video_title: "Dynamic Warmup Exercises | How to do Inch Worm"
    video_channel: "Twin Cities Orthopedics"
    source_url: "https://www.acefitness.org/resources/everyone/exercise-library/254/inchworms/"
    source_name: "ACE Fitness"
- slug: crunch
  name: Crunches
  category: core
  impact: low
  level: 1
  equipment:
  floor: true
  sides: false
  ja: クランチ
  muscles:
  - abdominals
  - obliques
  - hip-flexors
  cues:
  - Lower back stays on the floor
  - Lift shoulder blades, chin off chest
  - Exhale as you curl up
  - Slow, never pull on your neck
  easier: Smaller lift range, hands behind your thighs.
  harder: Hold at the top for 2 seconds (or try Bicycle Crunches).
