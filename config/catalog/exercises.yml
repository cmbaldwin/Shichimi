# 30 exercises. Structural fields (slug..sides) are the contract: don't change them without updating AGENTS.md.
# Content fields (ja, muscles, cues, easier, harder, met) are filled by the catalog pass.
# MET values follow the 2024 Adult Compendium of Physical Activities (Conditioning exercise, group 02),
# rounded to the 2011 entries they descend from:
#   02020 calisthenics, vigorous effort (jumping jacks, burpees, jumping/plyometric moves): 8.0
#   02022 calisthenics, moderate effort (push-ups, squats, lunges, dips): 3.8 to 5.0
#   02024 calisthenics, light/moderate (core, back, glute-bridge style floor work): 2.8 to 3.8
#   Step-ups and shadow boxing: moderate, set to 5.0. Isometric holds (wall sit, planks): 3.3 to 3.8.
# Values are estimates for a 7-minute circuit; the app uses them for the optional kcal figure only.
# Motion (3D animation) lives in motions/<slug>.yml.
- slug: jumping_jacks
  name: Jumping Jacks
  category: cardio
  impact: high
  level: 1
  equipment:
  floor: false
  sides: false
  ja: ジャンピングジャック
  muscles:
  - calves
  - quadriceps
  - glutes
  - shoulders
  cues:
  - Land softly on the balls of your feet
  - Keep knees slightly soft
  - Reach arms fully overhead
  - Breathe steadily
  easier: 'Step-out jacks: step side to side without jumping, or try Shadow Boxing.'
  harder: Cross-over jacks (arms and legs cross in the middle) or add a squat at the
    wide point.
  met: 8.0
  reference:
    video_url: "https://www.youtube.com/watch?v=c4DAnQ6DtF8"
    video_title: "Jumping Jacks"
    video_channel: "FitnessBlender"
    source_url: "https://www.nasm.org/resource-center/exercise-library/jumping-jacks"
    source_name: "NASM"
- slug: high_knees
  name: High Knees
  category: cardio
  impact: high
  level: 2
  equipment:
  floor: false
  sides: false
  ja: 腿上げ（ももあげ）
  muscles:
  - hip-flexors
  - quadriceps
  - calves
  - core
  cues:
  - Drive knees to hip height
  - Stay tall, chest lifted
  - Pump arms opposite to legs
  - Land light and quiet
  easier: March in place with the same knee height, no jumping.
  harder: Sprint the pace, or drive each knee above hip height.
  met: 8.0
  reference:
    video_url: "https://www.youtube.com/watch?v=tx5rgpDAJRI"
    video_title: "High Knees"
    video_channel: "LivestrongWoman"
    source_url: "https://www.nhs.uk/live-well/exercise/how-to-warm-up-before-exercising/"
    source_name: "NHS (knee lifts, closest page)"
- slug: mountain_climbers
  name: Mountain Climbers
  category: cardio
  impact: low
  level: 2
  equipment:
  floor: true
  sides: false
  ja: マウンテンクライマー
  muscles:
  - core
  - shoulders
  - hip-flexors
  - quadriceps
  - chest
  cues:
  - Hands under shoulders, body in a line
  - Drive knees toward your chest
  - Keep hips level, not piking up
  - Breathe out as you switch
  easier: Slow the tempo, or put your hands on a chair seat or sturdy table.
  harder: Faster pace, or cross each knee toward the opposite elbow.
  met: 8.0
  reference:
    video_url: "https://www.youtube.com/watch?v=cnyTQDSE884"
    video_title: "How to Do Mountain Climbers | The Right Way | Well+Good"
    video_channel: "Well+Good"
    source_url: "https://www.acefitness.org/resources/everyone/exercise-library/258/mountain-climbers/"
    source_name: "ACE Fitness"
- slug: burpees
  name: Burpees
  category: cardio
  impact: high
  level: 3
  equipment:
  floor: true
  sides: false
  ja: バーピー
  muscles:
  - quadriceps
  - glutes
  - chest
  - shoulders
  - core
  cues:
  - Hands down, jump or step feet back
  - Keep your back flat in the plank
  - Stand tall, then jump lightly
  - Pace yourself, form over speed
  easier: Step back and forward instead of jumping, with no push-up (or try Squat
    Jumps).
  harder: Add a push-up at the bottom and a tuck jump at the top.
  met: 8.0
  reference:
    video_url: "https://www.youtube.com/watch?v=qLBImHhCXSw"
    video_title: "How To Do A Burpee | The Right Way | Well+Good"
    video_channel: "Well+Good"
    source_url: "https://health.clevelandclinic.org/plyometrics"
    source_name: "Cleveland Clinic (plyometrics)"
- slug: squat_jumps
  name: Squat Jumps
  category: cardio
  impact: high
  level: 2
  equipment:
  floor: false
  sides: false
  ja: ジャンプスクワット
  muscles:
  - quadriceps
  - glutes
  - calves
  - hamstrings
  cues:
  - Sit hips back before you jump
  - Drive through the whole foot
  - Land softly with bent knees
  - Knees track over your toes
  easier: Plain Squats with a fast rise onto your toes.
  harder: Add a tuck at the top, or pause in the bottom for a second.
  met: 8.0
  reference:
    video_url: "https://www.youtube.com/watch?v=A-cFYWvaHr0"
    video_title: "How To Do A Squat Jump | The Right Way | Well+Good"
    video_channel: "Well+Good"
    source_url: "https://health.clevelandclinic.org/plyometrics"
    source_name: "Cleveland Clinic (plyometrics)"
- slug: skater_hops
  name: Skater Hops
  category: cardio
  impact: high
  level: 2
  equipment:
  floor: false
  sides: false
  ja: スケーターホップ
  muscles:
  - glutes
  - quadriceps
  - calves
  - hip-abductors
  - core
  cues:
  - Leap sideways, land on one foot
  - Soft knee, hips back on landing
  - Swing arms across for balance
  - Hold the landing a moment
  easier: Step wide side to side without hopping (or try Lateral Lunges).
  harder: Bigger leaps, or touch the floor on each landing.
  met: 8.0
  reference:
    video_url: "https://www.youtube.com/watch?v=dzVTuvRojzA"
    video_title: "Skater Hop"
    video_channel: "The Doctors of Physical Therapy"
    source_url: "https://health.clevelandclinic.org/plyometrics"
    source_name: "Cleveland Clinic (plyometrics)"
- slug: step_up
  name: Step-ups
  category: cardio
  impact: low
  level: 1
  equipment: chair
  floor: false
  sides: false
  ja: ステップアップ
  muscles:
  - quadriceps
  - glutes
  - calves
  - hamstrings
  cues:
  - Plant your whole foot on the chair
  - Drive up through the heel
  - Stand tall at the top
  - Use a sturdy chair against a wall
  easier: Use a lower step, or a stair, and go slower.
  harder: Drive the back knee up at the top, or step faster.
  met: 5.0
  reference:
    video_url: "https://www.youtube.com/watch?v=vOiHvzj5XhA"
    video_title: "Step Up Tutorial - Proper Form and Technique"
    video_channel: "Runna"
    source_url: "https://www.mayoclinic.org/healthy-lifestyle/fitness/multimedia/step-up/vid-20084661"
    source_name: "Mayo Clinic"
- slug: shadow_boxing
  name: Shadow Boxing
  category: cardio
  impact: low
  level: 1
  equipment:
  floor: false
  sides: false
  ja: シャドーボクシング
  muscles:
  - shoulders
  - core
  - calves
  - triceps
  cues:
  - Knees soft, weight on the balls of your feet
  - Rotate hips with every punch
  - Guard up, chin tucked
  - Stay light and keep moving
  easier: Throw slower punches with feet planted.
  harder: Add quick footwork and fast combinations (or try High Knees).
  met: 5.0
  reference:
    video_url: "https://www.youtube.com/watch?v=fWfsbL2ulj8"
    video_title: "How to Shadow Box 101 | Complete Shadowboxing Tutorial for Beginners"
    video_channel: "Tony Jeffries"
    source_url: "https://health.clevelandclinic.org/benefits-of-boxing"
    source_name: "Cleveland Clinic"
- slug: squat
  name: Squats
  category: lower
  impact: low
  level: 1
  equipment:
  floor: false
  sides: false
  ja: スクワット
  muscles:
  - quadriceps
  - glutes
  - hamstrings
  - core
  cues:
  - Feet shoulder-width, chest proud
  - Sit hips back and down
  - Knees track over your toes
  - Drive up through your heels
  easier: Squat to a chair and stand back up.
  harder: Slow the lowering to 3 seconds, or try Squat Jumps.
  met: 5.0
  reference:
    video_url: "https://www.youtube.com/watch?v=m0GcZ24pK6k"
    video_title: "How to do a body weight squat | Bupa Health"
    video_channel: "Bupa Health"
    source_url: "https://www.acefitness.org/resources/everyone/exercise-library/135/bodyweight-squat/"
    source_name: "ACE Fitness"
- slug: wall_sit
  name: Wall Sit
  category: lower
  impact: low
  level: 1
  equipment: wall
  floor: false
  sides: false
  ja: ウォールシット（壁椅子）
  muscles:
  - quadriceps
  - glutes
  - calves
  - core
  cues:
  - Back flat against the wall
  - Thighs parallel, knees over ankles
  - Press heels into the floor
  - Breathe, keep hands off your thighs
  easier: Slide up so your knees bend less than a right angle.
  harder: Lift one foot for a few seconds at a time, alternating.
  met: 3.8
  reference:
    video_url: "https://www.youtube.com/watch?v=JaZNYM3zAP0"
    video_title: "How To Do a Wall Sit | The Right Way | Well+Good"
    video_channel: "Well+Good"
    source_url: "https://health.clevelandclinic.org/wall-sits"
    source_name: "Cleveland Clinic"
- slug: lunge
  name: Alternating Lunges
  category: lower
  impact: low
  level: 2
  equipment:
  floor: false
  sides: false
  ja: 交互ランジ
  muscles:
  - quadriceps
  - glutes
  - hamstrings
  - calves
  cues:
  - Long step, torso upright
  - Lower back knee toward the floor
  - Front knee stays over the ankle
  - Push through the front heel
  easier: Shallow lunges holding a wall for balance (or try Squats).
  harder: Take bigger steps and pause at the bottom, or add a hop (Squat Jumps).
  met: 5.0
  reference:
    video_url: "https://www.youtube.com/watch?v=ugW5I-a5A-Q"
    video_title: "Lunges for Beginners // How to do a lunge"
    video_channel: "WeShape"
    source_url: "https://www.acefitness.org/resources/everyone/exercise-library/363/lunge/"
    source_name: "ACE Fitness"
- slug: lateral_lunge
  name: Lateral Lunges
  category: lower
  impact: low
  level: 2
  equipment:
  floor: false
  sides: false
  ja: サイドランジ
  muscles:
  - glutes
  - adductors
  - quadriceps
  - hamstrings
  cues:
  - Step wide, toes forward
  - Sit back into the stepping hip
  - Keep the other leg straight
  - Push off to return
  easier: Shorter side step, only a shallow bend (or try Sumo Squats).
  harder: Add a knee drive on return, or hop (Skater Hops).
  met: 4.5
  reference:
    video_url: "https://www.youtube.com/watch?v=4NlJdSzHeUg"
    video_title: "Exercises with an Athletic Trainer: Lateral Lunge"
    video_channel: "Children's Hospital Colorado"
    source_url: "https://www.acefitness.org/resources/everyone/exercise-library/364/lateral-lunge/"
    source_name: "ACE Fitness"
- slug: glute_bridge
  name: Glute Bridge
  category: lower
  impact: low
  level: 1
  equipment:
  floor: true
  sides: false
  ja: ヒップリフト（グルートブリッジ）
  muscles:
  - glutes
  - hamstrings
  - lower-back
  - core
  cues:
  - Feet flat, close to your hips
  - Press through your heels to lift
  - Squeeze glutes, ribs down
  - Lower slowly, one vertebra at a time
  easier: Smaller lift range, pausing for a breath at the top.
  harder: Lift one foot off the floor and alternate legs.
  met: 3.0
  reference:
    video_url: "https://www.youtube.com/watch?v=wPM8icPu6H8"
    video_title: "How To Do A Glute Bridge | The Right Way | Well+Good"
    video_channel: "Well+Good"
    source_url: "https://www.acefitness.org/resources/everyone/exercise-library/49/glute-bridge/"
    source_name: "ACE Fitness"
- slug: calf_raise
  name: Calf Raises
  category: lower
  impact: low
  level: 1
  equipment:
  floor: false
  sides: false
  ja: カーフレイズ
  muscles:
  - calves
  - soleus
  - ankles
  - feet
  cues:
  - Rise slowly onto your toes
  - Pause one beat at the top
  - Lower for a slow three count
  - Hold a wall if you wobble
  easier: Hold a wall for support and use a smaller range.
  harder: Raise on one leg at a time, or stand on a stair edge.
  met: 3.0
  reference:
    video_url: "https://www.youtube.com/watch?v=gwLzBJYoWlI"
    video_title: "How to Do Calf Raises"
    video_channel: "LIVESTRONG"
    source_url: "https://www.acefitness.org/resources/everyone/exercise-library/73/standing-calf-raises-wall/"
    source_name: "ACE Fitness"
- slug: sumo_squat
  name: Sumo Squats
  category: lower
  impact: low
  level: 1
  equipment:
  floor: false
  sides: false
  ja: ワイドスクワット
  muscles:
  - adductors
  - glutes
  - quadriceps
  - hamstrings
  cues:
  - Feet wide, toes turned out
  - Sit straight down between your feet
  - Knees follow your toes
  - Squeeze glutes at the top
  easier: Narrower stance with a shallow squat.
  harder: Lower slowly and add a calf raise at the top.
  met: 4.5
  reference:
    video_url: "https://www.youtube.com/watch?v=u2oXPmPH0hA"
    video_title: "How to Do Sumo Squats: A Guide from Physical Therapists"
    video_channel: "Hinge Health"
    source_url: "https://www.acefitness.org/resources/everyone/exercise-library/129/sumo-rotational-squats/"
    source_name: "ACE Fitness"
- slug: push_up
  name: Push-ups
  category: upper
  impact: low
  level: 2
  equipment:
  floor: true
  sides: false
  ja: 腕立て伏せ
  muscles:
  - chest
  - triceps
  - shoulders
  - core
  cues:
  - Hands under shoulders, body in a line
  - Elbows about 45 degrees from your body
  - Lower your chest to a fist's height
  - Don't let hips sag
  easier: Knee Push-ups, or hands on a table or counter.
  harder: Slow the lowering, or try Push-up & Rotation.
  met: 5.0
