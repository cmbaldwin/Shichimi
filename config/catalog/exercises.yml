- slug: plank
  name: Plank
  category: core
  impact: low
  level: 1
  equipment:
  floor: true
  sides: false
  ja: プランク
  muscles:
  - abdominals
  - obliques
  - shoulders
  - glutes
  cues:
  - Elbows under shoulders, body in a line
  - Glutes tight, don't let hips sag
  - Look at the floor, neck long
  - Breathe slowly the whole time
  easier: Plank on your knees, or hands on a chair seat.
  harder: Lift one foot or arm, or try Side Plank.
  met: 3.3
  reference:
    video_url: "https://www.youtube.com/watch?v=LSd0aTrVWlg"
    video_title: "How to Do a Plank: A Guide from Physical Therapists"
    video_channel: "Hinge Health"
    source_url: "https://www.acefitness.org/resources/everyone/exercise-library/32/front-plank/"
    source_name: "ACE Fitness"
- slug: side_plank
  name: Side Plank
  category: core
  impact: low
  level: 2
  equipment:
  floor: true
  sides: true
  ja: サイドプランク
  muscles:
  - obliques
  - glutes
  - shoulders
  - core
  cues:
  - Elbow under shoulder, hips stacked
  - Lift hips until you're in a line
  - Squeeze your glutes
  - Switch sides at the halfway cue
  easier: Bottom knee down, or plank on the forearms.
  harder: Raise the top leg, or reach the top arm under.
  met: 3.3
  reference:
    video_url: "https://www.youtube.com/watch?v=qbuqsJ9CuQA"
    video_title: "How to do a Side Plank: A Guide from Physical Therapists"
    video_channel: "Hinge Health"
    source_url: "https://www.acefitness.org/resources/everyone/exercise-library/101/side-plank-with-straight-leg/"
    source_name: "ACE Fitness"
- slug: bicycle_crunch
  name: Bicycle Crunches
  category: core
  impact: low
  level: 2
  equipment:
  floor: true
  sides: false
  ja: バイシクルクランチ
  muscles:
  - obliques
  - abdominals
  - hip-flexors
  cues:
  - Lower back pressed into the floor
  - Turn your ribs toward the knee
  - Slow and controlled, no neck pull
  - Extend the other leg long
  easier: Do it slowly with feet on the floor, or try Crunches.
  harder: Lower the straight leg closer to the floor.
