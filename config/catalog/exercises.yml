    source_name: "ACE Fitness"
- slug: knee_push_up
  name: Knee Push-ups
  category: upper
  impact: low
  level: 1
  equipment:
  floor: true
  sides: false
  ja: 膝つき腕立て伏せ
  muscles:
  - chest
  - triceps
  - shoulders
  - core
  cues:
  - Knees down, body a straight slope
  - Hands under shoulders
  - Lower your chest with control
  - Press the floor away
  easier: Hands on a counter or wall, body upright.
  harder: Full Push-ups.
  met: 3.8
  reference:
    video_url: "https://www.youtube.com/watch?v=__71lgdtiB8"
    video_title: "How To Properly Do A Modified Push-Up On Knees - Strength Exercises - Wellen"
