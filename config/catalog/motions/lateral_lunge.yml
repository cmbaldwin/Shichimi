# Lateral lunge (ACE): step wide to the side, toes forward, sit back into that hip with the other leg straight, push back. mirror adds the other side.
tempo: 5
yaw: 15
mirror: true
keys:
  - { lsh: [0, 8], rsh: [0, 8] }
  - { shift: [0.3, 0], spine: [22, 0, 0], lhip: [58, 28, 0], lkn: 72, rhip: [0, 42, 0], lsh: [75, 5], rsh: [75, 5], lel: 70, rel: 70 }
