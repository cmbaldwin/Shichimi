# Production server: 5.223.44.132 ("moab"). All apps are consolidated onto this
# single Hetzner box. 5.223.48.42, 5.223.51.74 and 5.223.54.207 are DECOMMISSIONED
# — an SSH host-key warning for any of them is expected, not a compromise.

service: shichimi
image: moab/shichimi

ssh:
  user: root

# One container. Solid Queue runs inside Puma; SQLite (WAL) lives on the
# shichimi_storage volume, so there are no accessories and no DB port.
servers:
  web:
    - 5.223.44.132

# Shared moab.jp Cloudflare Origin CA cert (SAN *.moab.jp) terminated at
# kamal-proxy, passed by secret name. Cloudflare SSL/TLS mode must be "Full".
# shichimi.moab.jp is already an orange-cloud A record → 5.223.44.132.
proxy:
  ssl:
    certificate_pem: CLOUDFLARE_SSL_CERT_PEM
    private_key_pem: CLOUDFLARE_SSL_KEY_PEM
  host: shichimi.moab.jp
  forward_headers: true
  healthcheck:
    path: /up
    interval: 10
    timeout: 30

# Self-hosted registry on escalante, Tailscale-only, HTTP (see /Users/cody/Dev/AGENTS.md).
registry:
  server: escalante.tailabd61f.ts.net:5555
  username: kamal
  password:
    - KAMAL_REGISTRY_PASSWORD

# Kamal secrets only — no Rails credentials, no RAILS_MASTER_KEY.
env:
  secret:
    - SECRET_KEY_BASE
    # Listed here (not only under proxy.ssl) so Kamal exports them to hooks,
    # which lets .kamal/hooks/pre-deploy validate the PEMs before a deploy.
    - CLOUDFLARE_SSL_CERT_PEM
    - CLOUDFLARE_SSL_KEY_PEM
    # Web Push
    - VAPID_PUBLIC_KEY
    - VAPID_PRIVATE_KEY
    - VAPID_SUBJECT
    # Uchujin (in-process error tracker at /uchujin) + alert mail via SES
    - UCHUJIN_DEPLOY_TOKEN
    - UCHUJIN_MCP_TOKEN
    - AWS_SES_SMTP_USERNAME
    - AWS_SES_SMTP_PASSWORD
  clear:
    # Solid Queue inside Puma. Do not add a job role — that starts a second supervisor.
    SOLID_QUEUE_IN_PUMA: true
    JOB_CONCURRENCY: 1
    WEB_CONCURRENCY: 0
    # Must stay >= config/queue.yml worker threads (3) + 2, or the Solid Queue
    # supervisor fails its pool check on boot and takes Puma down with it.
    RAILS_MAX_THREADS: 5
    RAILS_LOG_LEVEL: info

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# storage/ holds the three SQLite files; never copy production.sqlite3 alone
# (take a .backup snapshot first).
volumes:
  - "shichimi_storage:/rails/storage"

asset_path: /rails/public/assets

# Builds run locally (arm64 laptop → amd64 server via buildx emulation).
builder:
  arch: amd64
  # LOAD BEARING: the escalante registry 403s on provenance/SBOM attestation blobs.
  provenance: false
  sbom: false
